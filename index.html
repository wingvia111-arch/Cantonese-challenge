<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廣東話口語1分鐘隨機挑戰</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 25px; }
        
        /* 滾動話題區域 */
        .topic-box {
            height: 100px;
            overflow: hidden;
            position: relative;
            border: 2px solid #007bff;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #topic-text {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            transition: transform 0.1s ease-in-out;
            padding: 0 15px;
            line-height: 1.4;
        }

        /* 倒計時 */
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        /* 按鈕樣式 */
        button {
            font-size: 16px;
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        
        /* 專門為 iPhone 設計的實體下載按鈕樣式 */
        .btn-download { 
            background-color: #20c997; 
            color: white; 
            width: 100%; 
            margin: 15px 0; 
            display: none; /* 預設隱藏，錄音完才顯示 */
            text-decoration: none; 
            text-align: center; 
            border-radius: 8px; 
            font-size: 16px; 
            padding: 12px 0; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(32, 201, 151, 0.2);
        }
        button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.6; }

        /* AI 提示詞區域 */
        .ai-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
            display: none;
        }
        .ai-section h3 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            background: #f9f9f9;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 廣東話口語 1分鐘挑戰</h1>
    
    <!-- 話題滾動區 -->
    <div class="topic-box">
        <div id="topic-text">點擊下方按鈕抽取話題</div>
    </div>
    <button class="btn-primary" id="draw-btn" onclick="startTopicRoulette()">🎲 抽取話題</button>
    
    <!-- 倒計時區 -->
    <div class="timer" id="timer-display">01:00</div>
    
    <div>
        <button class="btn-success" id="start-btn" onclick="startChallenge()" disabled>▶️ 開始挑戰 (並錄音)</button>
        <button class="btn-danger" id="stop-btn" onclick="stopChallenge()" disabled>⏹️ 結束挑戰</button>
    </div>

    <!-- AI 分析提示詞 -->
    <div class="ai-section" id="ai-section">
        <h3>🤖 第一步：下載你的錄音檔</h3>
        <div id="audio-container" style="margin-bottom: 15px;"></div>
        
        <!-- 手機端專用實體下載按鈕 -->
        <a id="download-link" class="btn-download" href="#" download="cantonese_record.mp3">💾 下載錄音檔 (.mp3)</a>
        
        <h3 style="margin-top: 20px;">🤖 第二步：複製下方提示詞，連同錄音發給 AI</h3>
        <textarea id="prompt-text" readonly></textarea>
        <button class="btn-primary" style="width:100%; margin: 10px 0 0 0;" onclick="copyPrompt()">📋 複製 AI 提示詞</button>
    </div>
</div>

<script>
    // 100個廣東話隨機話題庫
    const topics = [
        "分享一個你最難忘的旅行經歷。",
        "如果你中了彩票頭獎，第一件事會做什麼？",
        "你認為人工智能（AI）會取代人類的工作嗎？",
        "介紹一種你最喜歡的香港道地美食。",
        "你理想中的週末是一步怎樣度過的？",
        "網購和實體店購物，你更喜歡哪一個？為什麼？",
        "如果你可以擁有一種超能力，你想選什麼？",
        "談談你對「工作與生活平衡（Work-Life Balance）」的看法。",
        "分享一部對你影響最深的電影或書籍。",
        "你覺得學習一門新語言最困難的地方在哪裡？",
        "如果你可以重回學生時代，你最想改變什麼？",
        "你認為賺錢和追求興趣，哪一個在職業生涯中更重要？",
        "請形容一下你最理想的居住環境是怎麼樣的？",
        "社群媒體（如IG/FB）對現代人的心理健康有什麼影響？",
        "分享一個你克服恐懼或困難的真實故事。",
        "你相信有外星人存在嗎？為什麼？",
        "如果要把一個城市推薦給外國朋友，你會推薦哪裡？",
        "你覺得現代人最大的壓力來源是什麼？",
        "分享一件你最近學會的新技能或新知識。",
        "如果可以跟歷史上的任何一位名人吃飯，你會選誰？",
        "你如何看待「斷捨離」和極簡主義的生活方式？",
        "你認為成功的定義是什麼？",
        "如果可以選擇，你想長生不老嗎？為什麼？",
        "分享一個你跟好朋友之間最深刻的點滴。",
        "你最喜歡哪個季節？請描述那個季節的迷人之處。",
        "你認為線上學習能完全取代傳統學校教育嗎？",
        "如果你要開一家店，你想開什麼店？為什麼？",
        "談談你對最崇拜的一個人是誰，他對你有什麼啟發？",
        "你覺得保持身體健康最有效的方法是什麼？",
        "如果世界末日即將來臨，你最後一天會想做什麼？",
        "分享一次你經歷過最尷尬或最好笑的誤會。",
        "你習慣早起（晨型人）還是熬夜（夜貓子）？為什麼？",
        "你對「電子書 vs 紙質書」有什麼看法？",
        "如果可以免費搬到任何一個國家居住一年，你會選哪裡？",
        "你覺得什麼年齡是人生中最美好的階段？",
        "分享一首你最近非常喜歡聽的歌，並說明原因。",
        "你認為金錢真的可以買到快樂嗎？",
        "介紹你家鄉最具特色的一個景點或傳統節日。",
        "如果你能預知未來，你想知道哪方面的事情？",
        "你如何處理自己面臨的負面情緒或焦慮？",
        "你認為養寵物對一個人的生活會帶來什麼改變？",
        "分享一個你堅持最久的壞習慣，以及你想怎麼戒掉它。",
        "你覺得現代人的通訊軟件（如WhatsApp）是拉近還是疏遠了人際關係？",
        "如果可以和十年前的自己說一句話，你會說什麼？",
        "談談你對「創業 vs 幫人打工」的看法與個人傾向。",
        "你最希望自己具備哪一種尚未擁有的才華？",
        "介紹一個你平時放鬆身心的「秘密基地」。",
        "你對「外貌焦慮」這個社會現象有什麼看法？",
        "分享一次你幫助別人或被別人幫助的溫暖經歷。",
        "如果一輩子只能吃一種食物，你會選擇吃什麼？",
        "你覺得一個人旅行和跟團旅行各有什麼優缺點？",
        "你認為「天賦」和「努力」哪一個對成功更具決定性？",
        "你如何安排自己的時間管理？有什麼私房秘訣嗎？",
        "談談你對現代「速食愛情」與傳統戀愛觀的看法。",
        "如果你要拍一部紀錄片，你會選擇什麼主題？",
        "你相信「男女之間有純友誼」嗎？",
        "分享一個你收過最特別或最感動的禮物。",
        "你認為素食主義在未來會成為主流嗎？",
        "你覺得小時候的娛樂（如跳橡皮筋）好玩，還是現在的手機遊戲好玩？",
        "如果可以和動物對話，你最想跟哪種動物聊天？",
        "你對現今社會「買樓上車」這個觀念有什麼看法？",
        "分享一個你人生中做過最勇敢的決定。",
        "你覺得什麼樣的行為才算是一個真正成熟的人？",
        "如果你被困在荒島，只能帶三樣東西，你會帶什麼？",
        "談談你對「躺平文化」或「內卷」的理解與感受。",
        "你最不喜歡別人身上出現什麼樣的性格特質？",
        "分享一個你最想去但還沒有機會去的國家或城市。",
        "你認為人工智慧發展下去，人類應該感到高興還是擔憂？",
        "介紹一部你認為「每個人都應該看一次」的神作電影。",
        "你平時是如何培養或保持自己的創造力的？",
        "如果你能發明一個能解決生活痛點的新科技，它會是什麼？",
        "你如何定義一段「高質量」的人際關係？",
        "分享一個你童年時期的夢想，現在實現了嗎？",
        "你認為追星（追隨偶像）對年輕人來說是好事還是壞事？",
        "談談你對「跨代溝通」（如父母與子女）的看法與建議。",
        "如果你可以任意改變自己外表的一個地方，你會想改哪裡？",
        "你覺得放假時宅在家裡（做宅男/宅女）是一種浪費時間嗎？",
        "分享你聽過最受用或最啟發你的一句座右銘。",
        "你認為科技發展讓人類的生活變得更簡單還是更複雜了？",
        "如果你的生命只剩下最後一個月，你會重新排列你的優先順序嗎？",
        "談談你對「自動駕駛汽車」全面普及的期待或擔憂。",
        "你覺得一個好老闆或好上司應該具備什麼條件？",
        "分享一次你搬家或換新環境的經歷與心情變化。",
        "你認為學校應該把「理財觀念」列為必修課嗎？",
        "如果你可以成為任意一部動漫或小說的主角，你想當誰？",
        "你對現代人越來越遲結婚或選擇不生育有什麼看法？",
        "分享一個你覺得最能代表香港流行文化的元素（如港產片、廣東歌）。",
        "你覺得生活在節奏快的城市好，還是節奏慢的小鎮好？",
        "如果時間可以倒流，你最想回到哪一年的哪一天？",
        "你如何維持長距離（異地）的友情或愛情？",
        "談談你對「電子支付全面取代現金」的看法。",
        "你最無法忍受的一種日常噪音是什麼？",
        "分享一個你曾經歷過、現在回想起來覺得很好笑的失敗經歷。",
        "你認為每個人都應該定期看心理諮詢（心理醫生）嗎？",
        "如果你有一整年不用工作的「無薪假」，你會怎麼安排？",
        "你覺得幽默感在人際交往中扮演著多重要的角色？",
        "談談你對「二手物品交易」（如買二手衫/二手商品）的接受度。",
        "你最期待未來的科技能實現哪一個天馬行空的功能？",
        "分享一個你覺得最舒適、最能充電的休閒活動。",
        "如果你能為這個世界消除一種疾病或問題，你会選擇什麼？"
    ];

    let rouletteInterval;
    let timerInterval;
    let currentTopic = "";
    let timeRemaining = 60; 
    let timeElapsed = 0;    
    let isChallenging = false;
    
    let mediaRecorder;
    let audioChunks = [];

    function startTopicRoulette() {
        if(isChallenging) return;
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("ai-section").style.display = "none";
        document.getElementById("download-link").style.display = "none";
        
        let counter = 0;
        clearInterval(rouletteInterval);
        
        rouletteInterval = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * topics.length);
            const topicText = document.getElementById("topic-text");
            topicText.innerText = topics[randomIndex];
            topicText.style.transform = counter % 2 === 0 ? "translateY(-3px)" : "translateY(3px)";
            counter++;
            
            if (counter > 15) { 
                clearInterval(rouletteInterval);
                topicText.style.transform = "translateY(0)";
                currentTopic = topics[randomIndex];
                document.getElementById("draw-btn").disabled = false;
                document.getElementById("start-btn").disabled = false;
                document.getElementById("timer-display").innerText = "01:00";
                document.getElementById("timer-display").style.color = "#333";
            }
        }, 80);
    }

    async function startChallenge() {
        audioChunks = [];
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                // 明確要求音訊格式以適應 iOS 檔案系統
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 優先使用 iOS 普遍支援的 mp4/aac 格式進行包裝，確保系統能正常儲存與解碼
                let options = { mimeType: 'audio/mp4' };
                if (!MediaRecorder.isTypeSupported('audio/mp4')) {
                    options = { mimeType: 'audio/webm' };
                }
                
                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };
                mediaRecorder.onstop = exportAudio;
                mediaRecorder.start();
            } catch (err) {
                console.log("麥克風無法開啟，僅啟用計時器。原因: ", err);
            }
        }

        isChallenging = true;
        timeRemaining = 60;
        timeElapsed = 0;
        
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("stop-btn").disabled = false;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            timeElapsed++;
            
            if (timeRemaining >= 0) {
                let mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                let secs = String(timeRemaining % 60).padStart(2, '0');
                document.getElementById("timer-display").innerText = `${mins}:${secs}`;
            } else {
                document.getElementById("timer-display").style.color = "#dc3545";
                let mins = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
                let secs = String(timeElapsed % 60).padStart(2, '0');
                document.getElementById("timer-display").innerText = `${mins}:${secs} (已超時)`;
            }
        }, 1000);
    }

    function stopChallenge() {
        clearInterval(timerInterval);
        isChallenging = false;
        
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop()); 
        } else {
            // 本地電腦測試不支援麥克風時的降級處理
            document.getElementById("ai-section").style.display = "block";
            document.getElementById("download-link").style.display = "none"; 
        }

        document.getElementById("draw-btn").disabled = false;
        document.getElementById("start-btn").disabled = false;
        document.getElementById("stop-btn").disabled = true;
        
        generatePrompt();
    }

    function exportAudio() {
        if(audioChunks.length === 0) return;
        
        // 判斷當前封裝的格式，動態命名副檔名
        const isMp4 = mediaRecorder.mimeType.includes('mp4');
        const fileExt = isMp4 ? 'mp4' : 'wav';
        const mimeType = isMp4 ? 'audio/mp4' : 'audio/wav';

        const audioBlob = new Blob(audioChunks, { type: mimeType });
        const audioUrl = URL.createObjectURL(audioBlob);
        
        // 更新網頁上的預覽播放器
        const container = document.getElementById("audio-container");
        container.innerHTML = `<audio src="${audioUrl}" controls style="width:100%;"></audio>`;
        
        // 將音訊網址與屬性綁定到我們手動建立的實體下載按鈕上
        const downloadLink = document.getElementById("download-link");
        downloadLink.href = audioUrl;
        downloadLink.download = `cantonese_record.${fileExt}`;
        downloadLink.style.display = "block"; // 顯示按鈕
        
        document.getElementById("ai-section").style.display = "block";
    }

    function generatePrompt() {
        let finalMins = Math.floor(timeElapsed / 60);
        let finalSecs = timeElapsed % 60;
        
        let prompt = `我正在練習廣東話（粵語）口語。我剛剛針對話題：\n「${currentTopic}」\n進行了 ${finalMins} 分鐘 ${finalSecs} 秒的即興演說。並上傳了錄音檔。\n\n請你扮演專業的廣東話老師，聽我的錄音並做出以下分析：\n1. 語音發音：指出我哪些字音、聲調（九聲六調）發得不準確，並給出正確拼音（粵拼）與糾正建議。\n2. 道地用詞：分析我是否有使用不自然的普通話直譯句式。請幫我改成香港人日常最道地、最口語化的粵語表達方式。`;
        
        document.getElementById("prompt-text").value = prompt;
    }

    function copyPrompt() {
        const textarea = document.getElementById("prompt-text");
        textarea.select();
        textarea.setSelectionRange(0, 99999); 
        try {
            navigator.clipboard.writeText(textarea.value);
            alert("提示詞已複製！請將錄音檔和提示詞一起發給 AI 進行分析。");
        } catch (err) {
            document.execCommand("copy");
            alert("提示詞已複製！");
        }
    }
</script>

</body>
</html>
