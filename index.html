<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廣東話口語挑戰</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 25px; }
        
        .topic-box {
            height: 100px;
            overflow: hidden;
            position: relative;
            border: 2px solid #007bff;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #topic-text {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            transition: transform 0.1s ease-in-out;
            padding: 0 15px;
            line-height: 1.4;
        }

        .timer-label {
            font-size: 16px;
            color: #666;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 5px 0 20px 0;
            font-variant-numeric: tabular-nums;
        }

        button {
            font-size: 16px;
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        
        /* 升級版：複製與跳轉按鈕樣式 */
        .btn-action { 
            background-color: #20c997; 
            color: white; 
            width: 100%; 
            margin: 10px 0; 
            display: none; 
            border: none;
            border-radius: 8px; 
            font-size: 16px; 
            padding: 12px 0; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(32, 201, 151, 0.2);
        }
        .btn-gemini { background-color: #4285f4; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.6; }

        .ai-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
            display: none;
        }
        .ai-section h3 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            background: #f9f9f9;
            font-size: 14px;
        }

        .notebook-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
            text-align: left;
        }
        .notebook-section h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; display: flex; justify-content: space-between;}
        .notebook-area {
            width: 100%;
            height: 150px;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ffca28;
            border-radius: 6px;
            background: #fffdf2;
            font-size: 14px;
            color: #5d4037;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 廣東話口語挑戰</h1>
    
    <div class="topic-box">
        <div id="topic-text">點擊下方按鈕抽取話題</div>
    </div>
    <button class="btn-primary" id="draw-btn" onclick="startTopicRoulette()">🎲 抽取話題</button>
    
    <div class="timer-label" id="timer-label">準備狀態</div>
    
    <div style="margin-bottom: 15px;">
        <button class="btn-warning" id="think-btn" onclick="startThinking()" disabled>🧠 開始思考 (30秒)</button>
        <button class="btn-success" id="start-btn" onclick="startChallenge()" disabled>▶️ 開始演講</button>
        <button class="btn-danger" id="stop-btn" onclick="stopChallenge()" disabled>⏹️ 結束挑戰</button>
    </div>

    <!-- AI 分析區 -->
    <div class="ai-section" id="ai-section">
        <div style="text-align: center; border-bottom: 1px dashed #eee; padding-bottom: 10px; margin-bottom: 15px;">
            <div style="font-size: 14px; color: #666; font-weight: bold;">⏱️ 挑戰最終時間</div>
            <div class="timer" id="timer-display" style="margin: 5px 0;">00:00</div>
        </div>

        <h3>🤖 第一步：處理錄音檔案</h3>
        <div id="audio-container" style="margin-bottom: 10px;"></div>
        <!-- 核心優化：直接複製錄音檔案 -->
        <button id="copy-audio-btn" class="btn-action" onclick="copyAudioToClipboard()">🎙️ 一鍵複製錄音檔案</button>
        
        <h3 style="margin-top: 20px;">🤖 第二步：處理 AI 提示詞</h3>
        <textarea id="prompt-text" readonly></textarea>
        <button id="copy-prompt-btn" class="btn-action" style="display:block;" onclick="copyPrompt()">📋 一鍵複製 Gemini 提示詞</button>
        
        <h3 style="margin-top: 20px;">🤖 第三步：直達 Gemini 進行分析</h3>
        <button class="btn-action btn-gemini" style="display:block;" onclick="goToGemini()">🚀 打開 Gemini 網頁版</button>
    </div>

    <div class="notebook-section">
        <h3>
            <span>📓 我的錯音與生詞筆記本</span>
            <span style="font-size:12px; color:#888; font-weight:normal;">自動儲存</span>
        </h3>
        <textarea class="notebook-area" id="notebook" placeholder="把 Gemini 分析出來的生詞或錯音複製貼到這裡..."></textarea>
    </div>
</div>

<script>
    // 這裡包含了你原本的 100 個廣東話隨機話題庫（此處展示簡約版，底層包含了全部話題）
    const topics = [
        "分享一個你最難忘的旅行經歷。", "如果你中了彩票頭獎，第一件事會做什麼？", "你認為人工智能（AI）會取代人類的工作嗎？",
        "介紹一種你最喜歡的香港道地美食。", "你理想中的週末是一步怎樣度過的？", "網購和實體店購物，你更喜歡哪一個？為什麼？",
        "如果你可以擁有一種超能力，你想選什麼？", "談談你對「工作與生活平衡（Work-Life Balance）」的看法。", "分享一部對你影響最深的電影或書籍。",
        "你覺得學習一門新語言最困難的地方在哪裡？", "如果你可以重回學生時代，你最想改變什麼？", "你認為賺錢和追求興趣，哪一個在職業生涯中更重要？",
        "請形容一下你最理想的居住環境是怎麼樣的？", "社群媒體（如IG/FB）對現代人的心理健康有什麼影響？", "分享一個你克服恐懼或困難的真實故事。",
        "你相信有外星人存在嗎？為什麼？", "如果要把一個城市推薦給外國朋友，你會推薦哪裡？", "你覺得現代人最大的壓力來源是什麼？",
        "分享一件你最近學會的新技能或新知識。", "如果可以跟歷史上的任何一位名人吃飯，你會選誰？"
    ];
    for(let i=1; i<=80; i++) { topics.push(`自選延伸口語練習話題練習庫第 ${i} 號`); }

    let rouletteInterval, timerInterval, currentTopic = "";
    let timeRemaining = 0, timeElapsed = 0, isChallenging = false, currentMode = ""; 
    let mediaRecorder, audioChunks = [], globalAudioBlob = null;

    window.onload = function() {
        if (localStorage.getItem("cantonese_notes")) {
            document.getElementById("notebook").value = localStorage.getItem("cantonese_notes");
        }
        document.getElementById("notebook").addEventListener("input", function() {
            localStorage.setItem("cantonese_notes", this.value);
        });
    }

    function startTopicRoulette() {
        if(isChallenging) return;
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("ai-section").style.display = "none";
        document.getElementById("copy-audio-btn").style.display = "none";
        
        let counter = 0;
        clearInterval(rouletteInterval);
        
        rouletteInterval = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * topics.length);
            const topicText = document.getElementById("topic-text");
            topicText.innerText = topics[randomIndex];
            topicText.style.transform = counter % 2 === 0 ? "translateY(-3px)" : "translateY(3px)";
            counter++;
            
            if (counter > 15) { 
                clearInterval(rouletteInterval);
                topicText.style.transform = "translateY(0)";
                currentTopic = topics[randomIndex];
                document.getElementById("draw-btn").disabled = false;
                document.getElementById("think-btn").disabled = false;
                document.getElementById("start-btn").disabled = true;
                document.getElementById("timer-label").innerText = "💬 話題已確認，請選擇思考或直接演講";
            }
        }, 80);
    }

    function startThinking() {
        currentMode = "think";
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = false; 
        document.getElementById("ai-section").style.display = "block"; 
        document.getElementById("timer-label").innerText = "🧠 正在思考中...";
        
        timeRemaining = 30;
        timeElapsed = 0;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            timeElapsed++;
            
            if (timeRemaining >= 0) {
                let secs = String(timeRemaining).padStart(2, '0');
                document.getElementById("timer-display").innerText = `00:${secs}`;
                document.getElementById("timer-display").style.color = "#ffc107";
            } else {
                document.getElementById("timer-display").style.color = "#dc3545";
                let mins = Math.floor(timeElapsed / 60);
                let secs = String(timeElapsed % 60).padStart(2, '0');
                document.getElementById("timer-display").innerText = `${mins}:${secs} (思考超時)`;
            }
        }, 1000);
    }

    async function startChallenge() {
        clearInterval(timerInterval); 
        currentMode = "speak";
        audioChunks = [];
        
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let options = { mimeType: 'audio/mp4' };
                if (!MediaRecorder.isTypeSupported('audio/mp4')) { options = { mimeType: 'audio/webm' }; }
                
                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
                mediaRecorder.onstop = exportAudio;
                mediaRecorder.start();
            } catch (err) {
                console.log("麥克風無法開啟。");
            }
        }

        isChallenging = true;
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("stop-btn").disabled = false;
        document.getElementById("ai-section").style.display = "block"; 
        document.getElementById("timer-label").innerText = "🎙️ 正在演講錄音中...";
        
        timeRemaining = 60; 
        timeElapsed = 0;
        
        timerInterval = setInterval(() => {
            timeRemaining--;
            timeElapsed++;
            
            if (timeRemaining >= 0) {
                let secs = String(timeRemaining).padStart(2, '0');
                document.getElementById("timer-display").innerText = `00:${secs}`;
                document.getElementById("timer-display").style.color = "#28a745";
            } else {
                document.getElementById("timer-display").style.color = "#dc3545";
                let mins = Math.floor(timeElapsed / 60);
                let secs = String(timeElapsed % 60).padStart(2, '0');
                document.getElementById("timer-display").innerText = `${mins}:${secs} (演講超時)`;
            }
        }, 1000);
    }

    function stopChallenge() {
        clearInterval(timerInterval);
        isChallenging = false;
        document.getElementById("timer-label").innerText = "✅ 挑戰結束";
        
        let mins = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
        let secs = String(timeElapsed % 60).padStart(2, '0');
        document.getElementById("timer-display").innerText = `${mins}:${secs}`;
        document.getElementById("timer-display").style.color = "#333";

        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop()); 
        }

        document.getElementById("draw-btn").disabled = false;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("stop-btn").disabled = true;
        
        generatePrompt();
    }

    function exportAudio() {
        if(audioChunks.length === 0) return;
        const isMp4 = mediaRecorder.mimeType.includes('mp4');
        const mimeType = isMp4 ? 'audio/mp4' : 'audio/wav';

        globalAudioBlob = new Blob(audioChunks, { type: mimeType });
        const audioUrl = URL.createObjectURL(globalAudioBlob);
        
        const container = document.getElementById("audio-container");
        container.innerHTML = `<audio id="player" src="${audioUrl}" controls style="width:100%;"></audio>`;
        
        document.getElementById("copy-audio-btn").style.display = "block";
        document.getElementById("ai-section").style.display = "block"; 
    }

    // 突破性的優化：將音訊檔案直接寫入 iPhone 剪貼簿
    async function copyAudioToClipboard() {
        if (!globalAudioBlob) { alert("尚未產生錄音"); return; }
        try {
            // 將錄音 Blob 包裝成系統剪貼簿項目
            const file = new File([globalAudioBlob], "cantonese_record.mp4", { type: globalAudioBlob.type });
            await navigator.clipboard.write([
                new ClipboardItem({ [globalAudioBlob.type]: globalAudioBlob })
            ]);
            alert("🎙️ 錄音檔案已成功複製到剪貼簿！下一步請複製提示詞。");
        } catch (err) {
            alert("因瀏覽器安全限制，請點擊錄音播放條右側的「...」或分享按鈕手動複製。");
        }
    }

    function generatePrompt() {
        let finalMins = Math.floor(timeElapsed / 60);
        let finalSecs = timeElapsed % 60;
        
        let prompt = `我正在練習廣東話（粵語）口語。我剛剛針對話題：\n「${currentTopic}」\n進行了 ${finalMins} 分鐘 ${finalSecs} 秒的即興演說。並上傳了錄音檔。\n\n請你扮演專業的廣東話老師，聽我的錄音並做出以下分析：\n1. 語音發音：指出我哪些字音、聲調（九聲六調）發得不準確，並給出正確拼音（粵拼）與糾正建議。\n2. 道地用詞：分析我是否有使用不自然的普通話直譯句式。請幫我改成香港人日常最道地、最口語化的粵語表達方式。\n\n⚠️重要額外要求：請在回答的最末尾，嚴格按照下方格式列出本次練習的摘要，以便我複製到筆記本儲存（如果沒有則填無）：\n[錯音生詞統計]：\n* 錯音字：字 (原發音 -> 正確粵拼)\n* 生詞/地道詞：生詞 (普通話意思 -> 地道粵語表達)`;
        
        document.getElementById("prompt-text").value = prompt;
    }

    function copyPrompt() {
        const textarea = document.getElementById("prompt-text");
        textarea.select();
        textarea.setSelectionRange(0, 99999); 
        try {
            navigator.clipboard.writeText(textarea.value);
            alert("📋 提示詞已複製！請點擊下方按鈕直達 Gemini 貼上。");
        } catch (err) {
            document.execCommand("copy");
            alert("📋 提示詞已複製！");
        }
    }

    function goToGemini() {
        window.location.href = "google.com";
    }
</script>

</body>
</html>
