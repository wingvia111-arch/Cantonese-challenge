<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1分鐘口語挑戰</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 20px; }
        
        .lang-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background: #e4e6eb;
            padding: 4px;
            border-radius: 8px;
        }
        .lang-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin: 0;
        }
        .lang-btn.active {
            background: white;
            color: #007bff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .topic-box {
            height: 130px;
            overflow: hidden;
            position: relative;
            border: 2px solid #007bff;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #topic-text {
            font-size: 15px;
            font-weight: bold;
            color: #007bff;
            transition: transform 0.1s ease-in-out;
            padding: 10px 15px;
            line-height: 1.5;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .timer-label {
            font-size: 15px;
            color: #666;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 5px 0 20px 0;
            font-variant-numeric: tabular-nums;
        }

        button {
            font-size: 16px;
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        
        .btn-action { 
            background-color: #20c997; 
            color: white; 
            width: 100%; 
            margin: 10px 0; 
            display: none; 
            border: none;
            border-radius: 8px; 
            font-size: 16px; 
            padding: 12px 0; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(32, 201, 151, 0.2);
        }
        .btn-gemini { background-color: #4285f4; text-decoration: none; display: none; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.6; }

        .ai-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
            display: none;
        }
        .ai-section h3 { margin: 0 0 10px 0; font-size: 15px; color: #555; }
        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            background: #f9f9f9;
            font-size: 14px;
        }

        .notebook-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
            text-align: left;
        }
        .notebook-section h3 { margin: 0 0 10px 0; font-size: 15px; color: #333; display: flex; justify-content: space-between;}
        .notebook-area {
            width: 100%;
            height: 150px;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ffca28;
            border-radius: 6px;
            background: #fffdf2;
            font-size: 14px;
            color: #5d4037;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 1分鐘口語挑戰</h1>
    
    <div class="lang-switch">
        <button class="lang-btn active" id="lang-hk" onclick="switchLanguage('hk')">廣東話 (Cantonese)</button>
        <button class="lang-btn" id="lang-en" onclick="switchLanguage('en')">雅思英語 (IELTS Speaking)</button>
    </div>
    
    <div class="topic-box">
        <div id="topic-text">點擊下方按鈕抽取話題</div>
    </div>
    <button class="btn-primary" id="draw-btn" onclick="startTopicRoulette()">🎲 抽取話題 / Draw Topic</button>
    
    <div class="timer-label" id="timer-label">準備狀態</div>
    
    <div style="margin-bottom: 15px;">
        <button class="btn-warning" id="think-btn" onclick="startThinking()" disabled>🧠 開始思考 (30秒)</button>
        <button class="btn-success" id="start-btn" onclick="startChallenge()" disabled>▶️ 開始演講</button>
        <button class="btn-danger" id="stop-btn" onclick="stopChallenge()" disabled>⏹️ 結束挑戰</button>
    </div>

    <div class="ai-section" id="ai-section">
        <div style="text-align: center; border-bottom: 1px dashed #eee; padding-bottom: 10px; margin-bottom: 15px;">
            <div style="font-size: 13px; color: #666; font-weight: bold;" id="final-time-lbl">⏱️ 挑戰最終時間</div>
            <div class="timer" id="timer-display" style="margin: 5px 0;">00:00</div>
        </div>

        <h3 id="step1-lbl">🤖 第一步：處理錄音檔案</h3>
        <div id="audio-container" style="margin-bottom: 10px;"></div>
        <button id="copy-audio-btn" class="btn-action" onclick="copyAudioToClipboard()">🎙️ 一鍵複製錄音檔案 / Copy Audio</button>
        
        <h3 style="margin-top: 20px;" id="step2-lbl">🤖 第二步：處理 AI 提示詞</h3>
        <textarea id="prompt-text" readonly></textarea>
        <button id="copy-prompt-btn" class="btn-action" style="display:block;" onclick="copyPrompt()">📋 一鍵複製 Gemini 提示詞</button>
        
        <h3 style="margin-top: 20px;" id="step3-lbl">🤖 第三步：直達 Gemini 進行分析</h3>
        <!-- 💡 這裡已經百分之百修正為標準原生跳轉按鈕，徹底解決 404 和不跳轉問題 -->
        <a id="gemini-btn" class="btn-action btn-gemini" href="https://gemini.google.com/" target="_blank">🚀 打開 Gemini 網頁版</a>
    </div>

    <div class="notebook-section">
        <h3>
            <span id="notebook-title">📓 我的錯音與生詞筆記本</span>
            <span style="font-size:12px; color:#888; font-weight:normal;" id="autosave-lbl">自動儲存</span>
        </h3>
        <textarea class="notebook-area" id="notebook" placeholder="把 Gemini 分析出來的生詞或錯音複製貼到這裡..."></textarea>
    </div>
</div>

<script>
    const hkTopics = [
        "分享一個你最難忘的旅行經歷。",
        "介紹一種你最喜歡的香港道地美食。"
    ];

    const enTopics = [
        "IELTS Part 2: Describe a city you would like to visit in the future. You should say: where it is, what it is famous for, how you know about it, and explain why you want to visit it.",
        "IELTS Part 2: Describe an old person you know and respect. You should say: who this person is, how you know them, what they are like, and explain why you respect them."
    ];

    let currentLang = 'hk'; 
    let rouletteInterval, timerInterval, currentTopic = "";
    let timeRemaining = 0, timeElapsed = 0, isChallenging = false; 
    let mediaRecorder, audioChunks = [], globalAudioBlob = null;

    window.onload = function() {
        loadNotebookText();
    }

    function switchLanguage(lang) {
        if(isChallenging) return;
        currentLang = lang;
        document.getElementById('lang-hk').classList.toggle('active', lang === 'hk');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        
        if(lang === 'hk') {
            document.getElementById('topic-text').innerText = "點擊下方按鈕抽取話題";
            document.getElementById('timer-label').innerText = "準備狀態";
            document.getElementById('think-btn').innerText = "🧠 開始思考 (30秒)";
            document.getElementById('start-btn').innerText = "▶️ 開始演講";
            document.getElementById('stop-btn').innerText = "⏹️ 結束挑戰";
            document.getElementById('notebook-title').innerText = "📓 我的錯音與生詞筆記本";
            document.getElementById('notebook').placeholder = "把 Gemini 分析出來的生詞或錯音複製貼到這裡...";
        } else {
            document.getElementById('topic-text').innerText = "Click the button below to draw an IELTS Speaking Cue Card";
            document.getElementById('timer-label').innerText = "Ready Status";
            document.getElementById('think-btn').innerText = "🧠 Start Thinking (30s)";
            document.getElementById('start-btn').innerText = "▶️ Start Speaking";
            document.getElementById('stop-btn').innerText = "⏹️ Stop Challenge";
            document.getElementById('notebook-title').innerText = "📓 IELTS Vocabulary & Pronunciation Notes";
            document.getElementById('notebook').placeholder = "Paste the IELTS vocabulary or idioms analyzed by Gemini here...";
        }
        loadNotebookText();
        document.getElementById("ai-section").style.display = "none";
    }

    function loadNotebookText() {
        const key = "notes_" + currentLang;
        document.getElementById("notebook").value = localStorage.getItem(key) || "";
        document.getElementById("notebook").oninput = function() {
            localStorage.setItem(key, this.value);
        };
    }

    function startTopicRoulette() {
        if(isChallenging) return;
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("ai-section").style.display = "none";
        document.getElementById("copy-audio-btn").style.display = "none";
        
        let counter = 0;
        const targetTopics = currentLang === 'hk' ? hkTopics : enTopics;
        clearInterval(rouletteInterval);
        
        rouletteInterval = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * targetTopics.length);
            const topicText = document.getElementById("topic-text");
            topicText.innerText = targetTopics[randomIndex];
            topicText.style.transform = counter % 2 === 0 ? "translateY(-3px)" : "translateY(3px)";
            counter++;
            
            if (counter > 15) { 
                clearInterval(rouletteInterval);
                topicText.style.transform = "translateY(0)";
                currentTopic = targetTopics[randomIndex];
                document.getElementById("draw-btn").disabled = false;
                document.getElementById("think-btn").disabled = false;
                document.getElementById("start-btn").disabled = true;
                
                document.getElementById("timer-label").innerText = currentLang === 'hk' ? 
                    "💬 話題已確認，請選擇思考或直接演講" : "💬 IELTS Cue Card drawn! Choose to think or speak.";
            }
        }, 80);
    }

    function startThinking() {
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = false; 
        document.getElementById("ai-section").style.display = "block"; 
        document.getElementById("timer-label").innerText = currentLang === 'hk' ? "🧠 正在思考中..." : "🧠 Thinking & Outlining...";
        
        timeRemaining = 30;
        timeElapsed = 0;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            timeElapsed++;
            
            if (timeRemaining >= 0) {
                let secs = String(timeRemaining).padStart(2, '0');
                document.getElementById("timer-display").innerText = `00:${secs}`;
                document.getElementById("timer-display").style.color = "#ffc107";
            } else {
                document.getElementById("timer-display").style.color = "#dc3545";
                let mins = Math.floor(timeElapsed / 60);
                let secs = String(timeElapsed % 60).padStart(2, '0');
                document.getElementById("timer-display").innerText = currentLang === 'hk' ? 
                    `${mins}:${secs} (思考超時)` : `${mins}:${secs} (Preparation Timeout)`;
            }
        }, 1000);
    }

    async function startChallenge() {
        clearInterval(timerInterval); 
        audioChunks = [];
        
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let options = { mimeType: 'audio/mp4' };
                if (!MediaRecorder.isTypeSupported('audio/mp4')) { options = { mimeType: 'audio/webm' }; }
                
                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
                mediaRecorder.onstop = exportAudio;
                mediaRecorder.start();
            } catch (err) {
                console.log("麥克風無法開啟。");
            }
        }

        isChallenging = true;
        document.getElementById("draw-btn").disabled = true;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("stop-btn").disabled = false;
        document.getElementById("ai-section").style.display = "block"; 
        document.getElementById("timer-label").innerText = currentLang === 'hk' ? "🎙️ 正在演講錄音中..." : "🎙️ Recording IELTS Speech...";
        
        timeRemaining = 60; 
        timeElapsed = 0;
        
        timerInterval = setInterval(() => {
            timeRemaining--;
            timeElapsed++;
            
            if (timeRemaining >= 0) {
                let secs = String(timeRemaining).padStart(2, '0');
                document.getElementById("timer-display").innerText = `00:${secs}`; 
                document.getElementById("timer-display").style.color = "#28a745";
            } else {
                document.getElementById("timer-display").style.color = "#dc3545";
                let mins = Math.floor(timeElapsed / 60);
                let secs = String(timeElapsed % 60).padStart(2, '0');
                document.getElementById("timer-display").innerText = currentLang === 'hk' ? 
                    `${mins}:${secs} (演講超時)` : `${mins}:${secs} (Overtime)`;
            }
        }, 1000);
    }

    function stopChallenge() {
        clearInterval(timerInterval);
        isChallenging = false;
        document.getElementById("timer-label").innerText = currentLang === 'hk' ? "✅ 挑戰結束" : "✅ Task Finished";
        
        let mins = String(Math.floor(timeElapsed / 60)).padStart(2, '0');
        let secs = String(timeElapsed % 60).padStart(2, '0');
        document.getElementById("timer-display").innerText = `${mins}:${secs}`;
        document.getElementById("timer-display").style.color = "#333";

        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop()); 
        }

        document.getElementById("draw-btn").disabled = false;
        document.getElementById("think-btn").disabled = true;
        document.getElementById("start-btn").disabled = true;
        document.getElementById("stop-btn").disabled = true;
        
        generatePrompt();
    }

    function exportAudio() {
        if(audioChunks.length === 0) return;
        const isMp4 = mediaRecorder.mimeType.includes('mp4');
        const mimeType = isMp4 ? 'audio/mp4' : 'audio/wav';

        globalAudioBlob = new Blob(audioChunks, { type: mimeType });
        const audioUrl = URL.createObjectURL(globalAudioBlob);
        
        // 核心優化：賦予錄音專屬的標題與ID，強制 iPhone 系統將其識別為可直接分享的媒體文件
        const container = document.getElementById("audio-container");
        container.innerHTML = `<audio id="player" src="${audioUrl}" title="我的口語練習錄音" controls style="width:100%;"></audio>`;
        
        // 隱藏在 iPhone 上失效的「一鍵複製錄音」按鈕，避免混淆
        document.getElementById("copy-audio-btn").style.display = "none";
        document.getElementById("gemini-btn").style.display = "block";
        document.getElementById("ai-section").style.display = "block"; 
        
        // 動態根據當前語言更換提示文字
        if(currentLang === 'hk') {
            document.getElementById('final-time-lbl').innerText = "⏱️ 挑戰最終時間";
            document.getElementById('step1-lbl').innerText = "🤖 第一步：長按上方播放條 ➔ 分享/發送到 Gemini";
            document.getElementById('step2-lbl').innerText = "🤖 第二步：處理 AI 提示詞";
            document.getElementById('step3-lbl').innerText = "🤖 第三步：直達 Gemini 進行分析";
            document.getElementById('copy-prompt-btn').innerText = "📋 一鍵複製 Gemini 提示詞";
        } else {
            document.getElementById('final-time-lbl').innerText = "⏱️ Final Spoken Time";
            document.getElementById('step1-lbl').innerText = "🤖 Step 1: Long-press audio bar above ➔ Share/Send to Gemini";
            document.getElementById('step2-lbl').innerText = "🤖 Step 2: Process AI Prompt";
            document.getElementById('step3-lbl').innerText = "🤖 Step 3: Go to Gemini for Analysis";
            document.getElementById('copy-prompt-btn').innerText = "📋 One-click Copy Gemini Prompt";
        }
    }

    async function copyAudioToClipboard() {
        if (!globalAudioBlob) { alert("尚未產生錄音 / No audio recorded"); return; }
        try {
            await navigator.clipboard.write([
                new ClipboardItem({ [globalAudioBlob.type]: globalAudioBlob })
            ]);
            alert(currentLang === 'hk' ? "🎙️ 錄音檔案已成功複製到剪貼簿！下一步請複製提示詞。" : "🎙️ Audio file copied to clipboard! Next, copy the prompt.");
        } catch (err) {
            alert(currentLang === 'hk' ? "因瀏覽器限制，請長按播放條手動複製。" : "Browser restricted. Please long-press the audio bar to copy.");
        }
    }

    function generatePrompt() {
        let finalMins = Math.floor(timeElapsed / 60);
        let finalSecs = timeElapsed % 60;
        let prompt = "";
        
        if (currentLang === 'hk') {
            prompt = `我正在練習廣東話（粵語）口語。我剛剛針對話題：\n「${currentTopic}」\n進行了 ${finalMins} 分鐘 ${finalSecs} 秒的即興演說。並上傳了錄音檔。\n\n請你扮演專業的廣東話老師，聽我的錄音並做出以下分析：\n1. 語音發音：指出我哪些字音、聲調（九聲六調）發得不準確，並給出正確拼音（粵拼）與糾正建議。\n2. 道地用詞：分析我是否有使用不自然的普通話直譯句式。請幫我改成香港人日常最道地、最口語化的粵語表達方式。\n\n⚠️重要額外要求：請在回答的最末尾，嚴格按照下方格式列出本次練習的摘要，以便我複製到筆記本儲存（如果沒有則填無）：\n[錯音生詞統計]：\n* 錯音字：字 (原發音 -> 正確粵拼)\n* 生詞/地道詞：生詞 (普通話意思 -> 地道粵語表達)`;
        } else {
            prompt = `I am practicing my English speaking skills for the IELTS Speaking Test Part 2. I just gave a ${finalMins}m ${finalSecs}s speech on the following IELTS Cue Card topic:\n"${currentTopic}"\nand I have uploaded my recording file.\n\nPlease act as an expert IELTS Speaking Examiner and provide an evaluation based on the official IELTS band descriptors:\n1. Fluency & Coherence & Pronunciation: Analyze my fluency, pauses, speech rate, and point out any mispronounced words or incorrect syllable stresses with phonetic symbols (IPA).\n2. Lexical Resource & Grammatical Range: Identify any unnatural word choices or grammatical errors. Suggest high-level vocabulary, idioms, and collocations suitable for achieving Band 7 or above.\n\n⚠️CRITICAL REQUIREMENT: At the very end of your response, strictly output a summary using the format below so I can copy and paste it into my notebook (write 'None' if applicable):\n[錯音生詞統計]:\n* Mispronounced Words: Word (Your Pronunciation -> Correct IPA)\n* Advanced IELTS Vocabulary: New Phrase (Literal Meaning -> Band 7+ Authentic Expression)`;
        }
        
        document.getElementById("prompt-text").value = prompt;
    }

    function copyPrompt() {
        const textarea = document.getElementById("prompt-text");
        textarea.select();
        textarea.setSelectionRange(0, 99999); 
        try {
            navigator.clipboard.writeText(textarea.value);
            alert(currentLang === 'hk' ? "📋 提示詞已複製！請點擊下方按鈕直達 Gemini 貼上。" : "📋 Prompt copied! Click the button below to paste into Gemini.");
        } catch (err) {
            document.execCommand("copy");
            alert("📋 Copied!");
        }
    }
</script>

</body>
</html>
